name: 生产环境验证

# 手动触发：推送部署完成后验证远端服务
# 或在 CI 确定性回归通过后自动触发（main 分支推送）
on:
  workflow_run:
    workflows: ["CI / Deterministic Regression"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: '远端部署地址（留空则用 DEPLOY_URL secret，再退到默认部署地址）'
        required: false
        type: string
        default: ''
      run_integration:
        description: '是否运行集成回归测试 (消耗上游配额)'
        required: false
        type: boolean
        default: false

# 目标地址优先级：手动输入 > DEPLOY_URL secret > 此默认值。
# 这是公开可访问的部署地址，写在这里让 workflow 开箱即用；
# 换环境时配 DEPLOY_URL secret 覆盖即可，不必改这个文件。
env:
  DEFAULT_DEPLOY_URL: https://sider2claude.asu.deno.net

jobs:
  # ── 冒烟验证（零上游成本） ──
  smoke-verify:
    name: 冒烟验证
    runs-on: ubuntu-latest
    # 仅 CI 通过后才运行；手动触发时始终运行
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 固定次版本，与 ci.yml 保持一致（理由见 ci.yml 的 Setup Deno 注释）。
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install

      - name: 确定目标地址
        id: target
        env:
          INPUT_URL: ${{ github.event.inputs.target_url }}
          SECRET_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          URL="${INPUT_URL:-${SECRET_URL:-$DEFAULT_DEPLOY_URL}}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "目标地址: $URL"

      - name: 健康检查
        run: |
          URL="${{ steps.target.outputs.url }}"
          echo "🔍 检查目标服务: $URL"
          # 本 workflow 由 CI 完成触发，而同一次 push 也会让 Deno Deploy 重新部署，
          # 两者是并行的——健康检查可能撞上部署窗口（旧实例已停、新实例未就绪），
          # 加上 Deno Deploy 实例有冷启动（实测首次请求约 4.4s），一击不中就判死会误报。
          # 因此重试等待，总窗口 3 分钟。
          #
          # 强制 IPv4：该域名同时有 A(69.67.170.170) 与 AAAA(2602:f70f::1) 记录，
          # 而 Azure/GitHub runner 是 IPv6 优先的。IPv6 侧若不可达会拖慢甚至拖垮
          # 每次尝试，而本服务的 IPv4 侧已验证稳定可达；健康检查不需要验证 IPv6，
          # 固定走 v4 可消除这一变量。
          MAX=12
          for i in $(seq 1 $MAX); do
            STATUS=$(curl -s -4 -o /dev/null -w "%{http_code}" --max-time 30 "$URL/health" || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ 服务可达（第 $i 次尝试）"
              exit 0
            fi
            echo "   第 $i/$MAX 次：HTTP $STATUS，15 秒后重试…"
            sleep 15
          done

          # 走到这里说明 3 分钟内始终未就绪。把诊断信息抬到 Annotations，
          # 便于区分"服务真的挂了"与"runner 到 Deploy 的网络问题"。
          V4=$(curl -s -4 -o /dev/null -w "%{http_code}" --max-time 20 "$URL/health" || echo "fail")
          V6=$(curl -s -6 -o /dev/null -w "%{http_code}" --max-time 20 "$URL/health" || echo "fail")
          RESOLVED=$(getent hosts "${URL#https://}" | tr '\n' ' ' || echo "解析失败")
          echo "::error::健康检查失败：$MAX 次尝试均未返回 200（最后状态 $STATUS）。诊断 IPv4=$V4 IPv6=$V6 解析=$RESOLVED"
          exit 1

      - name: 模型列表验证
        run: |
          echo "📋 检查模型列表..."
          RESPONSE=$(curl -s -4 --max-time 30 -w "\n%{http_code}" "${{ steps.target.outputs.url }}/v1/models")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "❌ GET /v1/models 返回 $HTTP_CODE"
            exit 1
          fi

          MODEL_COUNT=$(echo "$BODY" | grep -o '"id"' | wc -l || echo "0")
          echo "   模型数: $MODEL_COUNT"
          if [[ "$MODEL_COUNT" -lt 1 ]]; then
            echo "❌ 模型列表为空"
            exit 1
          fi
          echo "✅ 模型列表正常"

      - name: 认证测试
        run: |
          echo "🔒 检查认证保护..."
          STATUS=$(curl -s -4 --max-time 30 -o /dev/null -w "%{http_code}" \
            -X POST "${{ steps.target.outputs.url }}/v1/messages" \
            -H "Content-Type: application/json" \
            -d '{"model":"test","messages":[{"role":"user","content":"hi"}],"max_tokens":10}')
          if [[ "$STATUS" != "401" ]]; then
            echo "❌ 缺少 token 时应返回 401，实际: $STATUS"
            exit 1
          fi
          echo "✅ 认证保护正常 (401)"

      - name: CORS 检查
        run: |
          echo "🌐 检查 CORS 配置..."
          STATUS=$(curl -s -4 --max-time 30 -o /dev/null -w "%{http_code}" \
            -X OPTIONS "${{ steps.target.outputs.url }}/health" \
            -H "Origin: http://localhost:3000" \
            -H "Access-Control-Request-Method: POST")
          echo "   OPTIONS 状态码: $STATUS"
          echo "✅ CORS 配置可访问"

  # ── 集成回归测试（消耗上游配额，仅手动触发时可选） ──
  integration-regression:
    name: 集成回归测试
    runs-on: ubuntu-latest
    needs: [smoke-verify]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 固定次版本，与 ci.yml 保持一致（理由见 ci.yml 的 Setup Deno 注释）。
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install

      - name: 确定目标地址
        id: target
        env:
          INPUT_URL: ${{ github.event.inputs.target_url }}
          SECRET_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          URL="${INPUT_URL:-${SECRET_URL:-$DEFAULT_DEPLOY_URL}}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "目标地址: $URL"

      - name: 运行集成测试
        env:
          TEST_ENV: deno-deploy
          TEST_API_BASE_URL: ${{ steps.target.outputs.url }}
          TEST_AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: bun run test:integration

  # ── 汇总 ──
  summary:
    name: ✅ 生产验证汇总
    needs: [smoke-verify, integration-regression]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 报告结果
        env:
          SMOKE: ${{ needs.smoke-verify.result }}
          INTEGRATION: ${{ needs.integration-regression.result }}
        run: |
          # skipped 是合法状态，不能与 failure 混为一谈：
          # - smoke-verify 在 CI 未通过时被跳过，真正的失败信号由 CI workflow 给出，
          #   这里再红一次只是重复报警，还会让人误以为线上服务出了问题；
          # - integration-regression 默认就不跑（仅 workflow_dispatch 且显式勾选时执行）。
          describe() {
            case "$1" in
              success)   echo "✅ 通过" ;;
              skipped)   echo "⏭️ 未执行" ;;
              cancelled) echo "⚪ 已取消" ;;
              *)         echo "❌ 失败" ;;
            esac
          }

          {
            echo "## 生产环境验证结果"
            echo ""
            echo "| Job | 结果 | 说明 |"
            echo "|---|---|---|"
            echo "| smoke-verify | $(describe "$SMOKE") | 零上游消耗冒烟测试 |"
            echo "| integration-regression | $(describe "$INTEGRATION") | 集成回归（默认不跑，消耗上游配额）|"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          # 只有真失败才让本 workflow 变红。
          if [[ "$SMOKE" == "failure" ]]; then
            echo "❌ 冒烟测试失败，远端服务可能有问题。" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [[ "$INTEGRATION" == "failure" ]]; then
            echo "❌ 集成回归失败，远端服务功能异常。" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # 只有冒烟确实跑过并通过，才算验证通过；
          # skipped / cancelled 都不是"通过"，但也不该报红。
          if [[ "$SMOKE" == "success" ]]; then
            echo "✅ 生产验证通过。" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "⏭️ 冒烟测试未执行完成（$SMOKE）：可能是上游的确定性回归未通过，" >> $GITHUB_STEP_SUMMARY
          echo "或本次事件不满足触发条件。本 workflow 不重复报警，" >> $GITHUB_STEP_SUMMARY
          echo "请以 CI / Deterministic Regression 的结果为准。" >> $GITHUB_STEP_SUMMARY
